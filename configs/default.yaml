seed: 3830
data_dir: data
checkpoint_dir: checkpoints
results_dir: results
log_dir: logs
figures_dir: results/figures

model:
  name: resnet18
  num_classes: 10

train:
  epochs: 50
  batch_size: 256
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  num_workers: 0
  subset_size: null

eval:
  dataset: synthetic
  cifar10c_dir: null
  batch_size: 256
  num_workers: 0
  subset_size: null
  corruptions:
    - gaussian_noise
    - gaussian_blur
    - motion_blur
    - brightness
    - contrast
    - pixelate
    - jpeg
  severities: [1, 2, 3, 4, 5]

tta:
  lr: 0.001
  steps: 1
  thresholds: [0.5, 0.7, 0.9]
